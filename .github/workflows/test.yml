name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # tests/gnupg.mjs uses the runner's own GnuPG: what this app writes, read by the engine under Kleopatra.
      - run: npm test
      - run: npm run build

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where tools/chrome.mjs looks.
      - run: npm run test:browser

      # The single HTML file must not pull anything off the network.
      - name: No external references in the build
        run: |
          if grep -oE '(src|href)="(https?:)?//[^"]*"' build/html-pgp.html; then
            echo "::error::external resources are left in build/html-pgp.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: html-pgp
          path: |
            build/html-pgp.html
            build/html-pgp-extension-*.zip
